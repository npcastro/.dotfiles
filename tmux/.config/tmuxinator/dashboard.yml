# /Users/nicolascastro/.config/tmuxinator/dashboard.yml

name: dashboard
root: ~/workspace/fintoc/<%= @settings["worktree"] || 'dashboard' %>

on_project_start:
  - doppler setup -c dev --no-interactive
  - nvm use && doppler run npm i

windows:
  - editor:
      panes:
        - nvim
  - server: drnr -- dev
  - terminal:
  - lazygit:
      panes:
        - lazygit
  - opencode:
      panes:
        opencode2
